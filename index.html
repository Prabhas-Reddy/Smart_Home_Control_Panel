<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Smart Home Control Panel — Mobile UI</title>
  <style>
    /* =====================
       Reset + base
       ===================== */
    :root{
      --bg:#0f1724; --card:#0b1220; --muted:#94a3b8; --accent:#38bdf8; --accent-2:#7c3aed;
      --glass: rgba(255,255,255,0.04);
      --success: #34d399; --danger:#fb7185;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:linear-gradient(180deg,#071021 0%, #081827 60%);color:#e6eef8}
    .app{max-width:430px;margin:18px auto;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(2,6,23,0.7);background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));}
    /* Mobile viewport look */
    header{padding:18px 18px 8px;display:flex;gap:12px;align-items:center}
    .avatar{width:52px;height:52px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;font-weight:700}
    .greeting{flex:1}
    .greeting h1{margin:0;font-size:1.1rem}
    .greeting p{margin:3px 0 0;color:var(--muted);font-size:0.82rem}
    .top-actions{display:flex;gap:8px}
    .btn{background:var(--glass);padding:8px;border-radius:10px;display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,0.03);cursor:pointer}
    .btn-toggle{padding:6px 10px;border-radius:999px}
    /* Dashboard card */
    .dashboard{padding:14px;border-top:1px solid rgba(255,255,255,0.02);display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
    .weather-block{display:flex;gap:12px;align-items:center}
    .temp-big{font-size:2rem;font-weight:700}

    .energy{background:linear-gradient(90deg, rgba(124,58,237,0.12), rgba(56,189,248,0.06));padding:12px;border-radius:12px;text-align:center;min-width:110px}
    .energy small{display:block;color:var(--muted);font-size:0.8rem}

    /* Rooms list */
    .rooms{padding:12px 12px 6px;display:flex;gap:12px;overflow-x:auto}
    .room-card{min-width:140px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:12px;border-radius:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:transform .22s ease, box-shadow .22s}
    .room-card.active{transform:translateY(-6px);box-shadow:0 8px 30px rgba(2,6,23,0.6);border:1px solid rgba(255,255,255,0.04)}
    .room-thumb{height:72px;border-radius:10px;background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:8px;color:#fff;font-weight:600;text-shadow:0 4px 18px rgba(0,0,0,0.6)}
    .room-meta{display:flex;justify-content:space-between;align-items:center}

    /* Devices grid */
    .devices{padding:12px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .device-card{background:linear-gradient(180deg, rgba(255,255,255,0.015), rgba(255,255,255,0.01));padding:12px;border-radius:12px;display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,0.02);transition:transform .15s ease}
    .device-card:hover{transform:translateY(-4px)}
    .device-icon{width:52px;height:52px;border-radius:10px;background:rgba(255,255,255,0.02);display:flex;align-items:center;justify-content:center;font-size:1.25rem}
    .device-body{flex:1}
    .device-body h4{margin:0;font-size:0.95rem}
    .device-body small{color:var(--muted)}
    .toggle{width:46px;height:26px;border-radius:999px;background:rgba(255,255,255,0.06);position:relative;padding:3px;cursor:pointer}
    .toggle .dot{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .18s cubic-bezier(.2,.9,.3,1), background .18s}
    .toggle.on{background:linear-gradient(90deg,var(--accent),var(--accent-2))}
    .toggle.on .dot{left:23px;background:var(--card)}

    /* footer */
    footer{padding:12px;text-align:center;color:var(--muted);font-size:0.84rem}

    /* Utilities */
    .muted{color:var(--muted)}
    .small{font-size:0.78rem}

    /* Smooth transitions for room change */
    .devices-wrap{position:relative;min-height:220px}
    .devices-enter{animation:fadeSlide .36s ease both}
    @keyframes fadeSlide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

    /* responsive */
    @media (max-width:420px){.app{margin:8px}}
  </style>
</head>
<body>
  <div class="app" id="app">
    <header>
      <div class="avatar" id="avatar">SH</div>
      <div class="greeting">
        <h1 id="greet">Good Morning</h1>
        <p id="subg">Here's the latest from your home</p>
      </div>
      <div class="top-actions">
        <div class="btn btn-toggle" id="unitToggle">°C</div>
        <div class="btn" id="refreshWeather" title="Refresh weather">⟳</div>
      </div>
    </header>

    <section class="dashboard">
      <div class="weather-block">
        <div>
          <div class="temp-big" id="currentTemp">--°</div>
          <div class="small muted" id="weatherDesc">Loading weather...</div>
        </div>
        <div class="muted small" style="margin-left:8px">●</div>
      </div>
      <div class="energy">
        <div style="font-weight:700;font-size:1.05rem" id="energyVal">-- kWh</div>
        <small>Energy usage (today)</small>
      </div>
    </section>

    <div class="rooms" id="roomsList" aria-label="Rooms list">
      <!-- Room cards injected here -->
    </div>

    <div class="devices-wrap" id="devicesWrap">
      <div class="devices" id="devicesGrid">
        <!-- Device cards injected here -->
      </div>
    </div>

    <footer>
      <div class="small muted">Toggle states are saved locally · Smooth transitions · Demo-ready UI</div>
    </footer>
  </div>

  <script>
    /* =====================
       Smart Home Control Panel — Single-file app
       Instructions: Replace WEATHER_API_KEY with your OpenWeatherMap API key (free tier).
       OpenWeatherMap quick start: https://openweathermap.org/api
       Save this file as index.html and open in a modern browser. Works offline for mock data; weather requests require network.
       ===================== */

    // ======= Configuration =======
    const WEATHER_API_KEY = '<YOUR_OPENWEATHERMAP_API_KEY>'; // <-- INSERT YOUR KEY HERE
    const DEFAULT_CITY = 'Bengaluru';

    // ======= Mock data (rooms & devices) =======
    const MOCK = {
      rooms: [
        { id:'living', name:'Living Room', bg:'https://images.unsplash.com/photo-1493666438817-866a91353ca9?q=80&w=1200&auto=format&fit=crop&ixlib=rb-4.0.3&s=3a18ad6f8f5f5a2a0d3b5a9c6d9ecb3f', devices: ['light1','tv1','ac1']},
        { id:'bed', name:'Bedroom', bg:'https://images.unsplash.com/photo-1505691723518-36a6f1d6c6a1?q=80&w=1200&auto=format&fit=crop&ixlib=rb-4.0.3&s=8c39aa1d9b2311b1b976f3c2d5cfb6b8', devices: ['light2','ac2']},
        { id:'kitchen', name:'Kitchen', bg:'https://images.unsplash.com/photo-1519710164239-da123dc03ef4?q=80&w=1200&auto=format&fit=crop&ixlib=rb-4.0.3&s=0c1a8f9f0f7e1c2c3d4e5f6a7b8c9d0e', devices: ['light3','oven1']},
        { id:'outdoor', name:'Patio', bg:'https://images.unsplash.com/photo-1505691723518-36a6f1d6c6a1?q=80&w=1200&auto=format&fit=crop&ixlib=rb-4.0.3&s=8c39aa1d9b2311b1b976f3c2d5cfb6b8', devices: ['sprinkler1']}
      ],
      devices: {
        light1: {id:'light1', name:'Ceiling Light', type:'light', room:'living', value:75},
        tv1: {id:'tv1', name:'Smart TV', type:'tv', room:'living', value:0},
        ac1: {id:'ac1', name:'AC', type:'ac', room:'living', value:24},
        light2: {id:'light2', name:'Bed Lamp', type:'light', room:'bed', value:0},
        ac2: {id:'ac2', name:'AC (Bed)', type:'ac', room:'bed', value:26},
        light3: {id:'light3', name:'Kitchen Light', type:'light', room:'kitchen', value:100},
        oven1: {id:'oven1', name:'Smart Oven', type:'oven', room:'kitchen', value:0},
        sprinkler1:{id:'sprinkler1', name:'Garden Sprinkler', type:'sprinkler', room:'outdoor', value:0}
      }
    };

    // ======= App state & persistence =======
    const STATE_KEY = 'smart-home-state-v1';
    let state = {
      selectedRoom: MOCK.rooms[0].id,
      devices: {},
      unit: 'metric' // 'metric' => °C, 'imperial' => °F
    };

    function loadState(){
      try{
        const raw = localStorage.getItem(STATE_KEY);
        if(raw){
          const parsed = JSON.parse(raw);
          state = {...state,...parsed};
        }
      }catch(e){console.warn('Could not load state',e)}
      // ensure every device has an on/off property
      for(const id in MOCK.devices){
        if(!state.devices[id]){
          const dev = MOCK.devices[id];
          state.devices[id] = {on: !!(dev.value && dev.value>0), value: dev.value || 0};
        }
      }
    }
    function saveState(){
      try{localStorage.setItem(STATE_KEY, JSON.stringify({selectedRoom:state.selectedRoom, devices:state.devices, unit:state.unit}));}catch(e){console.warn('save failed',e)}
    }

    // ======= Utilities =======
    function el(sel){return document.querySelector(sel)}
    function fmtTemp(v){ if(v==null) return '--'; return Math.round(v) + (state.unit === 'metric' ? '°C' : '°F'); }
    function convertKto(vK){ if(state.unit==='metric') return vK - 273.15; return (vK - 273.15) * 9/5 + 32; }

    // ======= Greeting =======
    function updateGreeting(){
      const now = new Date();
      const h = now.getHours();
      const greet = h<12? 'Good Morning' : (h<18? 'Good Afternoon' : 'Good Evening');
      el('#greet').textContent = greet;
      el('#avatar').textContent = (greet.split(' ')[1] || 'SH')[0] + 'H';
      el('#subg').textContent = `It's ${now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
    }

    // ======= Rooms UI =======
    function renderRooms(){
      const container = el('#roomsList'); container.innerHTML='';
      MOCK.rooms.forEach(room =>{
        const active = room.id === state.selectedRoom;
        const card = document.createElement('div'); card.className='room-card' + (active? ' active':'');
        card.onclick = ()=>{ state.selectedRoom = room.id; saveState(); renderRooms(); renderDevices(true); }
        const thumb = document.createElement('div'); thumb.className='room-thumb'; thumb.style.backgroundImage = `url(${room.bg})`;
        thumb.innerHTML = `<div style=\"font-size:0.9rem;\">${room.name}</div>`;
        const meta = document.createElement('div'); meta.className='room-meta';
        const activeDevices = room.devices.filter(id=> state.devices[id] && state.devices[id].on).length;
        meta.innerHTML = `<div class=\"small muted\">${room.devices.length} devices</div><div class=\"small\">${activeDevices} on</div>`;
        card.appendChild(thumb); card.appendChild(meta);
        container.appendChild(card);
      });
    }

    // ======= Devices UI =======
    function deviceIcon(type){
      switch(type){
        case 'light': return '💡';
        case 'tv': return '📺';
        case 'ac': return '❄️';
        case 'oven': return '🔥';
        case 'sprinkler': return '💧';
        default: return '🔌';
      }
    }
    function renderDevices(animate=false){
      const grid = el('#devicesGrid');
      grid.classList.remove('devices-enter');
      grid.innerHTML='';
      const room = MOCK.rooms.find(r=> r.id === state.selectedRoom);
      if(!room) return;
      room.devices.forEach(id=>{
        const dev = MOCK.devices[id];
        const dstate = state.devices[id] || {on:false,value:dev.value||0};
        const card = document.createElement('div'); card.className='device-card';
        const icon = document.createElement('div'); icon.className='device-icon'; icon.textContent = deviceIcon(dev.type);
        const body = document.createElement('div'); body.className='device-body';
        body.innerHTML = `<h4>${dev.name}</h4><small class=\"muted\">${dev.type.toUpperCase()} ${dstate.on? '• On' : '• Off'}</small>`;
        const tog = document.createElement('div'); tog.className = 'toggle ' + (dstate.on? 'on':'');
        const dot = document.createElement('div'); dot.className='dot'; tog.appendChild(dot);
        tog.onclick = (e)=>{ e.stopPropagation(); dstate.on = !dstate.on; if(dstate.on && dev.type === 'ac' && !dstate.value) dstate.value = dev.value || 24; state.devices[id] = dstate; saveState(); renderRooms(); renderDevices(); }
        // optional live reading
        const reading = document.createElement('div'); reading.className='small muted'; reading.style.marginLeft='8px';
        if(dev.type === 'ac') reading.textContent = `Set ${dstate.value || '--'}°`;
        else if(dev.type === 'light') reading.textContent = `Brightness ${dstate.value || 0}%`;
        else reading.textContent = '';

        card.appendChild(icon); card.appendChild(body); card.appendChild(tog);
        body.appendChild(reading);
        grid.appendChild(card);
      });
      if(animate){ setTimeout(()=> grid.classList.add('devices-enter'), 10); }
    }

    // ======= Weather fetch =======
    async function fetchWeather(){
      const tempEl = el('#currentTemp');
      const descEl = el('#weatherDesc');
      const energyEl = el('#energyVal');
      try{
        if(!WEATHER_API_KEY || WEATHER_API_KEY.includes('<')){
          descEl.textContent = 'No API key — using mocked weather';
          tempEl.textContent = state.unit==='metric' ? '27°C' : '80°F';
          energyEl.textContent = (Math.round(Math.random()*4)+4) + ' kWh';
          return;
        }
        descEl.textContent = 'Fetching...';
        // Using city name for simplicity — consider geolocation for accurate results
        const q = encodeURIComponent(DEFAULT_CITY);
        const url = `https://api.openweathermap.org/data/2.5/weather?q=${q}&appid=${WEATHER_API_KEY}`;
        const res = await fetch(url);
        if(!res.ok) throw new Error('Network error');
        const j = await res.json();
        const t = convertKto(j.main.temp);
        tempEl.textContent = fmtTemp(t);
        descEl.textContent = `${j.weather[0].main} · ${j.name}`;
        // mock energy usage based on temp
        energyEl.textContent = (Math.max(3, Math.round(Math.abs(t - 20) * 0.8) + 2)) + ' kWh';
      }catch(err){
        console.error('weather failed',err);
        descEl.textContent = 'Weather unavailable';
        tempEl.textContent = '--';
      }
    }

    // ======= Unit toggle =======
    function renderUnitToggle(){
      const btn = el('#unitToggle'); btn.textContent = state.unit==='metric'? '°C':'°F';
      btn.onclick = ()=>{
        state.unit = state.unit==='metric' ? 'imperial' : 'metric'; saveState(); renderUnitToggle(); fetchWeather(); renderDevices();
      }
    }

    // ======= Initialization =======
    function init(){
      loadState(); updateGreeting(); renderUnitToggle(); renderRooms(); renderDevices(); fetchWeather();
      // periodic weather refresh
      el('#refreshWeather').onclick = fetchWeather;
      setInterval(updateGreeting, 30*1000);
    }

    init();
  </script>
</body>
</html>
